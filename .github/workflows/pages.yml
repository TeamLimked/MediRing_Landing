# main 에 푸시하면 정적 생성(nuxt generate) 결과를 GitHub Pages 로 배포한다.
# 저장소 Settings → Pages → Source 가 "GitHub Actions" 여야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 진행 중인 배포는 끝까지 두고, 대기 중인 것만 최신으로 교체
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v6

      - name: Generate static site
        run: npx nuxt generate
        env:
          # 프로젝트 페이지는 https://<owner>.github.io/<repo>/ 하위 경로에서 서빙된다
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          NUXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NUXT_PUBLIC_APP_STORE_URL: ${{ vars.APP_STORE_URL }}
          NUXT_PUBLIC_PLAY_STORE_URL: ${{ vars.PLAY_STORE_URL }}
          # 약관·정책의 회사 정보 — 비어 있으면 자리표시자로 표시(data/legal.ts)
          NUXT_PUBLIC_COMPANY_NAME: ${{ vars.COMPANY_NAME }}
          NUXT_PUBLIC_COMPANY_REPRESENTATIVE: ${{ vars.COMPANY_REPRESENTATIVE }}
          NUXT_PUBLIC_COMPANY_BUSINESS_NUMBER: ${{ vars.COMPANY_BUSINESS_NUMBER }}
          NUXT_PUBLIC_COMPANY_ADDRESS: ${{ vars.COMPANY_ADDRESS }}
          NUXT_PUBLIC_COMPANY_PRIVACY_OFFICER: ${{ vars.PRIVACY_OFFICER_NAME }}
          NUXT_PUBLIC_COMPANY_PRIVACY_EMAIL: ${{ vars.PRIVACY_OFFICER_EMAIL }}
          NUXT_PUBLIC_COMPANY_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          NUXT_PUBLIC_COMPANY_POLICY_VERSION: ${{ vars.POLICY_VERSION }}
          NUXT_PUBLIC_COMPANY_LEGAL_DRAFT: ${{ vars.LEGAL_DRAFT_BANNER || 'true' }}
          # 메시지 테스트(/try/a·/try/b) 사전 신청 — Apps Script 웹 앱 URL(비우면 신청을 받지 않음), 보관처(google|domestic)
          NUXT_PUBLIC_WAITLIST_ENDPOINT: ${{ vars.WAITLIST_ENDPOINT }}
          NUXT_PUBLIC_WAITLIST_STORAGE: ${{ vars.WAITLIST_STORAGE || 'google' }}

      - run: touch .output/public/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
